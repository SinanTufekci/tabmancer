<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="tabmancer: Bit beside a few coding-agent sessions, one called back after it was cut off"><style>
    text { font-family: ui-monospace, 'Cascadia Mono', 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .bit { animation: hop 9s infinite; transform-box: fill-box; transform-origin: center bottom; }
    .light-a, .light-c { animation: glow 1.8s ease-in-out infinite; }
    .eyes-shut { opacity: 0; animation: shut 9s infinite; }
    .eyes-open { animation: open 9s infinite; }
    .arms-up { opacity: 0; animation: up 9s infinite; }
    .arms-down { animation: down 9s infinite; }
    .spark { opacity: 0; animation: spark 9s ease-out infinite; transform-box: fill-box; }
    .s-work { animation: s-work 9s infinite; }
    .s-wait { opacity: 0; animation: s-wait 9s infinite; }
    .s-done { opacity: 0; animation: s-done 9s infinite; }
    .r-dead { animation: r-dead 9s infinite; }
    .r-alive { opacity: 0; animation: r-alive 9s infinite; }
    .star { animation: turn 1.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .chip { animation: glow 2.4s ease-in-out infinite; }
    .halo { opacity: 0; animation: halo 9s infinite; }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes hop { 0%, 49%, 60%, 100% { transform: translateY(0); }
                      52% { transform: translateY(-14px); } }
    @keyframes open { 0%, 31%, 34%, 79%, 82%, 100% { opacity: 1; } 32%, 33%, 80%, 81% { opacity: 0; } }
    @keyframes shut { 0%, 31%, 34%, 79%, 82%, 100% { opacity: 0; } 32%, 33%, 80%, 81% { opacity: 1; } }
    @keyframes up { 0%, 48%, 66%, 100% { opacity: 0; }
                     49%, 65% { opacity: 1; } }
    @keyframes down { 0%, 48%, 66%, 100% { opacity: 1; }
                       49%, 65% { opacity: 0; } }
    @keyframes spark { 0% { opacity: 0; transform: translate(0, 0); }
                        2% { opacity: 1; }
                        14% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
                        100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
    @keyframes s-work { 0%, 30% { opacity: 1; } 33%, 97% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes s-wait { 0%, 30% { opacity: 0; } 33%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes s-done { 0%, 63% { opacity: 0; } 66%, 97% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes r-dead { 0%, 52% { opacity: 1; } 54%, 97% { opacity: 0; }
                         100% { opacity: 1; } }
    @keyframes r-alive { 0%, 52% { opacity: 0; } 54%, 97% { opacity: 1; }
                          100% { opacity: 0; } }
    @keyframes halo { 0%, 52% { opacity: 0; } 54% { opacity: 0.9; }
                       68%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
