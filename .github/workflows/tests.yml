name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.14"
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  # A real Mac, where nothing else has run tabmancer yet. Only on a public repository: there the
  # minutes are free, on a private one a Mac minute counts ten times.
  macos:
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q

  # The desktop window (`tabmancer desktop`, the desktop extra: Qt). The jobs above run without the
  # extra, where its tests skip and nothing else may need Qt; here it is installed and the window is
  # tested offscreen, with no screen. Linux runs the whole suite beside Qt, Windows the window's tests.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tests: tests/test_desktop_main.py tests/test_desktop_monitor.py tests/test_desktop_monitor_alone.py tests/test_desktop_errorlog.py tests/test_desktop_extra.py tests/test_store.py tests/test_desktop_teamgraph.py tests/test_desktop_conversation.py tests/test_desktop_teampanel.py tests/test_desktop_board.py tests/test_desktop_seam.py tests/test_desktop_table.py tests/test_desktop_opening.py tests/test_desktop_front.py tests/test_desktop_handover.py tests/test_desktop_teamhandover.py tests/test_desktop_rename.py tests/test_desktop_prompt.py tests/test_desktop_background.py tests/test_desktop_clisettings.py tests/test_desktop_signin.py tests/test_desktop_workspaces.py tests/test_desktop_newsession.py tests/test_desktop_newteam.py tests/test_desktop_new.py tests/test_desktop_teamstart.py tests/test_desktop_new_taken.py tests/test_desktop_teamkeysdialogs.py tests/test_desktop_teamkeys.py tests/test_desktop_limit.py tests/test_desktop_continue.py tests/test_desktop_summaries.py tests/test_desktop_summary_key.py tests/test_desktop_cleanup.py tests/test_desktop_acting.py tests/test_desktop_lock.py tests/test_desktop_came_up.py tests/test_terminal_golden.py tests/test_desktop_tray.py tests/test_desktop_stats.py tests/test_desktop_wrapped.py tests/test_desktop_toast_monitor.py tests/test_desktop_monitor_keys.py tests/test_desktop_bitpet.py tests/test_desktop_team_delete.py tests/test_desktop_unreadable.py tests/test_desktop_empty_card.py
          - os: ubuntu-latest
            tests: ""
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      TABMANCER_NEEDS_QT: "1"  # the window's tests fail here without Qt, not skip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.13"
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Fonts for Qt offscreen (Windows finds none unless told)
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_FONTDIR=C:\Windows\Fonts' >> "$GITHUB_ENV"
      - run: uv sync --locked --extra desktop
      - run: uv run --locked --extra desktop python -c "import PySide6; print('PySide6', PySide6.__version__)"
      - run: uv run --locked --extra desktop pytest -q ${{ matrix.tests }}

  # The newest Textual, past the pin in pyproject.toml. sixel.py overrides Textual internals (_display,
  # _end_update, _driver, ChopsUpdate.render_segments), so a new major can break Bit without an error.
  # Allowed to fail: a red run here says to look before raising the pin, it does not block a release.
  newest-textual:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv pip install --upgrade textual
      - run: uv run --no-sync python -c "import textual; print('textual', textual.__version__)"
      - run: uv run --no-sync pytest -q
