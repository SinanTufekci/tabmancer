name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: tabmancer doctor
      description: The output of `tabmancer doctor`. Leave out anything private from your sessions.
      render: text
  - type: input
    id: terminal
    attributes:
      label: OS and terminal
      placeholder: Windows 11, Windows Terminal 1.24
